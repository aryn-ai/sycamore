[tool.poetry]
name = "sycamore_poetry_lock"
version = "0.0.1"
description = "A fake meta-package to make it easier to force different poetry directories to lock to the same version."
authors = ["aryn.ai <opensource@aryn.ai>"]
readme = "README.md"
repository = "https://github.com/aryn-ai/sycamore.git"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# required older version
fsspec = "^2026.2.0"   # sycamore (via datasets)
pytest = "^9.0.3"
ray = "^2.55.1" 
pandas = "^3.0.2" # Bumped to a version that supports 3.13.
scipy = "^1.15.0"
weaviate-client = "^4.16.10"
urllib3 = "^2.6.3"

# Required to continue supporting python 3.9; it may be possible to make these a bit more
# current, but latest version no longer supports 3.9
networkx = "3.2.1"
ipython = "8.18.1"

# Package versions from being yanked
matplotlib = "3.10.3"


# Package versions specified because of github vulnerability reports
aiohttp = "^3.13.5"
authlib = "^1.7.1"
requests = "^2.33.1"
jinja2 = ">=3.1.6" # pinned for security reasons
cryptography = ">=46.0.7"
tornado = ">=6.5.5"
pillow = "^12.2.0"
# black = ">=24.3.0"
fonttools = "^4.60.2"
filelock = "^3.20.3"
ujson = "^5.12.0"
python-dotenv = "^1.2.2"
mistune = "^3.2.1"

httpcore = ">=1.0.9"
setuptools = ">=80.10.2"
pyasn1 = "^0.6.3"

# Need 5.x for pinecone connector. Need at least 5.29.6 due to CVE-2026-0994
protobuf = "^5.29.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

